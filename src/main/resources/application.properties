spring.application.name=QuickDrop
spring.cloud.config.enabled=false

# Note l'ajout de &createDatabaseIfNotExist=true à la fin de l'URL
spring.datasource.url=jdbc:mysql://localhost:3307/QuickDrop?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Force Hibernate à créer les tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Empêche la recherche d'une base de données cloud optionnelle qui peut ralentir le démarrage
spring.jpa.generate-ddl=true

# Désactive temporairement l'enregistrement auprès d'Eureka
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false